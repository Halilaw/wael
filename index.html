<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Wael Halila — Data, .NET, DevOps &amp; AI Engineer · Tunis</title>
  <style>
    /* ----- RESET & BASE ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #eef3fc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 1.5rem;
      color: #1a2b3c;
    }

    /* ----- MAIN CARD / AVATAR CONTAINER ----- */
    .avatar-card {
      background: #ffffff;
      border-radius: 2rem;
      padding: 2rem 1.5rem 1.5rem 1.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.02);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 460px;
      width: 100%;
    }

    /* ----- AVATAR CONTAINER ----- */
    .avatar-container {
      position: relative;
      width: 260px;
      height: 300px;
      margin-bottom: 1.5rem;
      transition: transform 0.3s ease;
    }

    .avatar-container:hover {
      transform: translateY(-3px);
    }

    /* --- Background (soft lavender/periwinkle like reference) --- */
    .avatar-bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #d8def4 0%, #e6eaf8 50%, #f2f4fb 100%);
      border-radius: 1.5rem;
      z-index: 1;
      overflow: hidden;
    }

    /* --- Turtleneck Sweater (body) --- */
    .sweater {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 240px;
      height: 120px;
      background: #3b3b3d;
      border-radius: 50% 50% 20% 20% / 70% 70% 30% 30%;
      z-index: 2;
      box-shadow: inset 0 10px 15px rgba(0, 0, 0, 0.25), inset 0 -8px 12px rgba(0, 0, 0, 0.35);
    }

    /* Turtleneck collar */
    .collar {
      position: absolute;
      bottom: 95px;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: 45px;
      background: #2f2f31;
      border-radius: 15px 15px 8px 8px;
      z-index: 3;
      box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.4), inset 0 -3px 6px rgba(0, 0, 0, 0.3);
    }

    /* Collar highlight */
    .collar::after {
      content: '';
      position: absolute;
      top: 6px;
      left: 10px;
      width: 70px;
      height: 6px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 10px;
    }

    /* --- Neck --- */
    .neck {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      width: 54px;
      height: 40px;
      background: #d9a98e;
      border-radius: 0 0 15px 15px;
      z-index: 2;
      box-shadow: inset 0 -6px 10px rgba(0, 0, 0, 0.15);
    }

    /* --- Head --- */
    .head {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 160px;
      height: 175px;
      background: #e8b89a;
      border-radius: 50% 50% 45% 45% / 50% 50% 50% 50%;
      z-index: 4;
      box-shadow: 
        inset -12px -12px 20px rgba(0, 0, 0, 0.08), 
        inset 8px 8px 20px rgba(255, 255, 255, 0.35);
    }

    /* --- Ears --- */
    .ear {
      position: absolute;
      top: 100px;
      width: 24px;
      height: 36px;
      background: #e8b89a;
      border-radius: 50%;
      z-index: 3;
      box-shadow: inset -2px -2px 5px rgba(0, 0, 0, 0.1);
    }
    .ear.left { left: 40px; }
    .ear.right { right: 40px; }

    /* --- Hair (voluminous swept back) --- */
    .hair-base {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 175px;
      height: 120px;
      background: #241c18;
      border-radius: 55% 55% 30% 30% / 80% 80% 20% 20%;
      z-index: 5;
      box-shadow: inset 0 10px 20px rgba(255, 255, 255, 0.12), inset 0 -10px 15px rgba(0, 0, 0, 0.5);
    }

    /* Voluminous swoop on top */
    .hair-swoop {
      position: absolute;
      top: 0px;
      left: 50%;
      transform: translateX(-50%) rotate(-3deg);
      width: 140px;
      height: 85px;
      background: linear-gradient(180deg, #2e2420 0%, #1f1814 100%);
      border-radius: 70% 60% 20% 30% / 90% 90% 10% 10%;
      z-index: 6;
      box-shadow: inset 0 8px 15px rgba(255, 255, 255, 0.1);
    }

    /* Hair side sweeps */
    .hair-side {
      position: absolute;
      top: 60px;
      width: 32px;
      height: 85px;
      background: #241c18;
      z-index: 4;
    }
    .hair-side.left {
      left: 42px;
      border-radius: 40% 0 50% 50% / 50% 0 50% 50%;
      transform: rotate(8deg);
    }
    .hair-side.right {
      right: 42px;
      border-radius: 0 40% 50% 50% / 0 50% 50% 50%;
      transform: rotate(-8deg);
    }

    /* --- Face Features --- */
    .face {
      position: absolute;
      top: 95px;
      left: 50%;
      transform: translateX(-50%);
      width: 130px;
      height: 130px;
      z-index: 7;
    }

    /* Eyebrows (thick, expressive) */
    .eyebrow {
      position: absolute;
      top: 12px;
      width: 36px;
      height: 10px;
      background: #1e1612;
      border-radius: 50% 50% 40% 40%;
      box-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }
    .eyebrow.left { left: 12px; transform: rotate(-6deg); }
    .eyebrow.right { right: 12px; transform: rotate(6deg); }

    /* Eyes (almond-shaped with subtle shine) */
    .eye {
      position: absolute;
      top: 30px;
      width: 30px;
      height: 28px;
      background: #ffffff;
      border-radius: 50% 50% 45% 45% / 55% 55% 45% 45%;
      box-shadow: inset 0 3px 5px rgba(0,0,0,0.12);
      overflow: hidden;
    }
    .eye.left { left: 14px; }
    .eye.right { right: 14px; }

    .pupil {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 16px;
      height: 16px;
      background: #1a100b;
      border-radius: 50%;
      transition: transform 0.1s ease-out;
    }
    .pupil::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 3px;
      width: 5px;
      height: 5px;
      background: #ffffff;
      border-radius: 50%;
      opacity: 0.95;
    }

    /* Nose */
    .nose {
      position: absolute;
      top: 58px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 32px;
      background: #db9f80;
      border-radius: 40% 40% 50% 50% / 30% 30% 70% 70%;
      box-shadow: inset -3px -4px 5px rgba(0,0,0,0.12), inset 2px 2px 3px rgba(255,255,255,0.2);
    }

    /* Mustache (thin, defined) */
    .mustache {
      position: absolute;
      top: 88px;
      left: 50%;
      transform: translateX(-50%);
      width: 56px;
      height: 10px;
      background: #1e1612;
      border-radius: 10px;
      z-index: 8;
      clip-path: polygon(0 30%, 15% 0, 50% 20%, 85% 0, 100% 30%, 85% 100%, 50% 80%, 15% 100%);
    }

    /* Goatee / Beard (chin patch) */
    .beard {
      position: absolute;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      width: 50px;
      height: 42px;
      background: #241c18;
      border-radius: 15% 15% 50% 50% / 10% 10% 90% 90%;
      z-index: 6;
      clip-path: polygon(15% 0, 85% 0, 100% 30%, 85% 100%, 50% 95%, 15% 100%, 0 30%);
    }

    /* Mouth (subtle smile) */
    .mouth {
      position: absolute;
      top: 98px;
      left: 50%;
      transform: translateX(-50%);
      width: 30px;
      height: 12px;
      background: #b0574a;
      border-radius: 40% 40% 50% 50% / 30% 30% 70% 70%;
      z-index: 9;
      box-shadow: inset 0 2px 3px rgba(0,0,0,0.25);
    }

    /* --- Round Glasses --- */
    .glasses {
      position: absolute;
      top: 85px;
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 50px;
      z-index: 10;
      pointer-events: none;
    }

    .lens {
      position: absolute;
      top: 0;
      width: 46px;
      height: 46px;
      border: 3.5px solid #111111;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
    }
    .lens.left { left: 14px; }
    .lens.right { right: 14px; }

    .bridge {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 18px;
      height: 4px;
      background: #111111;
      border-radius: 2px;
    }

    .temple {
      position: absolute;
      top: 20px;
      width: 14px;
      height: 4px;
      background: #111111;
      border-radius: 2px;
    }
    .temple.left { left: 0px; }
    .temple.right { right: 0px; }

    /* ----- INFO SECTION (personal) ----- */
    .info-section {
      text-align: center;
      width: 100%;
    }

    .name {
      font-size: 2rem;
      font-weight: 700;
      color: #0f1c2e;
      letter-spacing: -0.02em;
      margin-bottom: 0.2rem;
    }

    .title-badge {
      display: inline-block;
      background: #e5edf9;
      border-radius: 30px;
      padding: 0.3rem 1rem;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #2c577b;
      margin-bottom: 1rem;
    }

    .description {
      font-size: 0.9rem;
      line-height: 1.6;
      color: #3f5368;
      margin-bottom: 1.5rem;
      padding: 0 0.5rem;
    }

    .description strong {
      color: #0f1c2e;
      font-weight: 600;
    }

    /* tech pills */
    .tech-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin: 1.2rem 0;
    }

    .pill {
      background: #f0f4fa;
      border: 1px solid #d6e2f0;
      border-radius: 30px;
      padding: 0.3rem 0.9rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: #2c577b;
      transition: all 0.15s;
    }

    .pill:hover {
      background: #e0ebf7;
      border-color: #b0cae0;
    }

    /* location */
    .location {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.85rem;
      color: #6b8299;
      margin-top: 0.8rem;
      border-top: 1px solid #e6edf5;
      padding-top: 1rem;
      width: 80%;
      margin-left: auto;
      margin-right: auto;
    }

    .location svg {
      width: 16px;
      height: 16px;
      fill: #6b8299;
    }

    /* responsive */
    @media (max-width: 480px) {
      .avatar-card {
        padding: 1.5rem 1rem;
      }
      .name {
        font-size: 1.8rem;
      }
      .avatar-container {
        transform: scale(0.92);
        margin-bottom: 0.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="avatar-card">
    <!-- AVATAR — styled to match the reference image -->
    <div class="avatar-container" id="avatar">
      <!-- soft background panel -->
      <div class="avatar-bg"></div>

      <!-- body / turtleneck sweater -->
      <div class="sweater"></div>
      <div class="collar"></div>
      
      <!-- neck -->
      <div class="neck"></div>

      <!-- head -->
      <div class="head"></div>
      
      <!-- ears -->
      <div class="ear left"></div>
      <div class="ear right"></div>

      <!-- hair: base, swoop, sides -->
      <div class="hair-base"></div>
      <div class="hair-swoop"></div>
      <div class="hair-side left"></div>
      <div class="hair-side right"></div>

      <!-- facial features -->
      <div class="face">
        <div class="eyebrow left"></div>
        <div class="eyebrow right"></div>
        
        <div class="eye left"><div class="pupil"></div></div>
        <div class="eye right"><div class="pupil"></div></div>
        
        <div class="nose"></div>
        <div class="mustache"></div>
        <div class="beard"></div>
        <div class="mouth"></div>
      </div>

      <!-- round glasses -->
      <div class="glasses">
        <div class="lens left"></div>
        <div class="lens right"></div>
        <div class="bridge"></div>
        <div class="temple left"></div>
        <div class="temple right"></div>
      </div>
    </div>

    <!-- INFO (unchanged) -->
    <div class="info-section">
      <h1 class="name">Wael Halila</h1>
      <div class="title-badge">Data · .NET · DevOps · AI</div>
      <p class="description">
        Engineer with <strong>4+ years</strong> in financial services.
        Data integration, <strong>.NET 8</strong> microservices, Azure DevOps CI/CD,
        and an <strong>LLM assistant</strong> on Ivanti HEAT. ITIL 5 Foundation.
      </p>
      <div class="tech-pills">
        <span class="pill">.NET 8</span>
        <span class="pill">Azure DevOps</span>
        <span class="pill">LLM / AI</span>
        <span class="pill">Data Integration</span>
        <span class="pill">ITIL 5</span>
        <span class="pill">Ivanti HEAT</span>
      </div>
      <div class="location">
        <svg viewBox="0 0 24 24" width="16" height="16">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
        </svg>
        <span>Tunis, Tunisia</span>
      </div>
    </div>
  </div>

  <!-- subtle eye tracking -->
  <script>
    (function(){
      const pupils = document.querySelectorAll('.pupil');
      const avatar = document.getElementById('avatar');
      
      if (pupils.length && avatar) {
        document.addEventListener('mousemove', (e) => {
          const rect = avatar.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;
          
          // subtle tracking
          const deltaX = Math.max(-3, Math.min(3, (e.clientX - centerX) / 35));
          const deltaY = Math.max(-2, Math.min(2, (e.clientY - centerY) / 40));
          
          pupils.forEach(pupil => {
            pupil.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;
          });
        });
        
        document.addEventListener('mouseleave', () => {
          pupils.forEach(pupil => {
            pupil.style.transform = 'translate(-50%, -50%)';
          });
        });
      }
    })();
  </script>
</body>
</html>
