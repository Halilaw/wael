<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Wael Halila — Data, .NET, DevOps &amp; AI Engineer · Tunis</title>
  <style>
    /* ----- RESET & BASE ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #eef3fc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 1.5rem;
      color: #1a2b3c;
    }

    /* ----- MAIN CARD / AVATAR CONTAINER ----- */
    .avatar-card {
      background: #ffffff;
      border-radius: 2rem;
      padding: 2rem 1.5rem 1.5rem 1.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.02);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 460px;
      width: 100%;
    }

    /* ----- AVATAR CONTAINER ----- */
    .avatar-container {
      position: relative;
      width: 270px;
      height: 320px;
      margin-bottom: 1.5rem;
      transition: transform 0.3s ease;
    }

    .avatar-container:hover {
      transform: translateY(-3px);
    }

    /* --- Soft lavender background panel (matches reference) --- */
    .avatar-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 35%, #e9edfa 0%, #d8def4 60%, #ccd4f0 100%);
      border-radius: 1.75rem;
      z-index: 1;
      overflow: hidden;
    }

    /* --- Turtleneck Sweater (body) --- */
    .sweater {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 250px;
      height: 125px;
      background: linear-gradient(180deg, #47474a 0%, #3a3a3d 45%, #2b2b2e 100%);
      border-radius: 55% 55% 18% 18% / 75% 75% 25% 25%;
      z-index: 2;
      box-shadow:
        inset 0 12px 20px rgba(0, 0, 0, 0.3),
        inset 0 -10px 15px rgba(0, 0, 0, 0.45);
    }

    /* Turtleneck collar */
    .collar {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      width: 96px;
      height: 48px;
      background: linear-gradient(180deg, #3a3a3d 0%, #2c2c2f 100%);
      border-radius: 18px 18px 8px 8px;
      z-index: 3;
      box-shadow:
        inset 0 5px 10px rgba(0, 0, 0, 0.45),
        inset 0 -4px 8px rgba(0, 0, 0, 0.3);
    }

    .collar::after {
      content: '';
      position: absolute;
      top: 7px;
      left: 12px;
      width: 72px;
      height: 6px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 10px;
    }

    /* --- Neck --- */
    .neck {
      position: absolute;
      bottom: 126px;
      left: 50%;
      transform: translateX(-50%);
      width: 56px;
      height: 42px;
      background: linear-gradient(90deg, #d9a98e 0%, #e3b89a 50%, #d9a98e 100%);
      border-radius: 0 0 16px 16px;
      z-index: 2;
      box-shadow: inset 0 -8px 12px rgba(0, 0, 0, 0.15);
    }

    /* --- Head --- */
    .head {
      position: absolute;
      top: 45px;
      left: 50%;
      transform: translateX(-50%);
      width: 168px;
      height: 182px;
      background: radial-gradient(ellipse at 42% 35%, #f0c4a8 0%, #e8b89a 55%, #d9a98e 100%);
      border-radius: 50% 50% 46% 46% / 50% 50% 50% 50%;
      z-index: 4;
      box-shadow:
        inset -14px -14px 24px rgba(0, 0, 0, 0.08),
        inset 10px 10px 24px rgba(255, 255, 255, 0.4);
    }

    /* --- Ears --- */
    .ear {
      position: absolute;
      top: 108px;
      width: 26px;
      height: 38px;
      background: #e0b295;
      border-radius: 50%;
      z-index: 3;
      box-shadow: inset -3px -3px 6px rgba(0, 0, 0, 0.12);
    }
    .ear.left  { left: 40px; }
    .ear.right { right: 40px; }

    /* --- Hair (voluminous swept back, like reference) --- */
    .hair-base {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 184px;
      height: 128px;
      background: linear-gradient(180deg, #2e2420 0%, #1f1814 100%);
      border-radius: 55% 55% 30% 30% / 85% 85% 15% 15%;
      z-index: 5;
      box-shadow:
        inset 0 12px 22px rgba(255, 255, 255, 0.1),
        inset 0 -12px 18px rgba(0, 0, 0, 0.55);
    }

    /* Big voluminous swoop on top */
    .hair-swoop {
      position: absolute;
      top: -2px;
      left: 50%;
      transform: translateX(-50%) rotate(-4deg);
      width: 150px;
      height: 92px;
      background: linear-gradient(180deg, #352a25 0%, #241c18 100%);
      border-radius: 72% 62% 22% 32% / 92% 92% 8% 8%;
      z-index: 6;
      box-shadow: inset 0 10px 18px rgba(255, 255, 255, 0.12);
    }

    /* Hair side sweeps (faded sides) */
    .hair-side {
      position: absolute;
      top: 68px;
      width: 34px;
      height: 88px;
      background: #241c18;
      z-index: 4;
    }
    .hair-side.left {
      left: 40px;
      border-radius: 45% 0 55% 45% / 50% 0 55% 45%;
      transform: rotate(7deg);
    }
    .hair-side.right {
      right: 40px;
      border-radius: 0 45% 45% 55% / 0 50% 45% 55%;
      transform: rotate(-7deg);
    }

    /* --- Face Features --- */
    .face {
      position: absolute;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      width: 136px;
      height: 136px;
      z-index: 7;
    }

    /* Thick eyebrows */
    .eyebrow {
      position: absolute;
      top: 10px;
      width: 38px;
      height: 11px;
      background: #1e1612;
      border-radius: 50% 50% 40% 40%;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    }
    .eyebrow.left  { left: 12px;  transform: rotate(-6deg); }
    .eyebrow.right { right: 12px; transform: rotate(6deg); }

    /* Almond eyes */
    .eye {
      position: absolute;
      top: 30px;
      width: 32px;
      height: 30px;
      background: #ffffff;
      border-radius: 50% 50% 45% 45% / 55% 55% 45% 45%;
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.14);
      overflow: hidden;
    }
    .eye.left  { left: 14px; }
    .eye.right { right: 14px; }

    .pupil {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 17px;
      height: 17px;
      background: #1a100b;
      border-radius: 50%;
      transition: transform 0.1s ease-out;
    }
    .pupil::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 3px;
      width: 5px;
      height: 5px;
      background: #ffffff;
      border-radius: 50%;
      opacity: 0.95;
    }

    /* Nose */
    .nose {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 22px;
      height: 34px;
      background: linear-gradient(180deg, #e0a586 0%, #d39574 100%);
      border-radius: 42% 42% 50% 50% / 30% 30% 70% 70%;
      box-shadow:
        inset -3px -4px 5px rgba(0, 0, 0, 0.12),
        inset 2px 2px 3px rgba(255, 255, 255, 0.25);
    }

    /* Thin defined mustache */
    .mustache {
      position: absolute;
      top: 92px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 11px;
      background: #1e1612;
      border-radius: 10px;
      z-index: 8;
      clip-path: polygon(0 30%, 15% 0, 50% 22%, 85% 0, 100% 30%, 85% 100%, 50% 80%, 15% 100%);
    }

    /* Goatee / chin patch */
    .beard {
      position: absolute;
      top: 104px;
      left: 50%;
      transform: translateX(-50%);
      width: 54px;
      height: 46px;
      background: #241c18;
      border-radius: 15% 15% 50% 50% / 10% 10% 90% 90%;
      z-index: 6;
      clip-path: polygon(15% 0, 85% 0, 100% 28%, 85% 100%, 50% 94%, 15% 100%, 0 28%);
    }

    /* Subtle mouth */
    .mouth {
      position: absolute;
      top: 102px;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 12px;
      background: #b0574a;
      border-radius: 40% 40% 50% 50% / 30% 30% 70% 70%;
      z-index: 9;
      box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.28);
    }

    /* --- Round black glasses --- */
    .glasses {
      position: absolute;
      top: 90px;
      left: 50%;
      transform: translateX(-50%);
      width: 146px;
      height: 52px;
      z-index: 10;
      pointer-events: none;
    }

    .lens {
      position: absolute;
      top: 0;
      width: 48px;
      height: 48px;
      border: 3.5px solid #111111;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.07);
    }
    .lens.left  { left: 14px; }
    .lens.right { right: 14px; }

    .bridge {
      position: absolute;
      top: 21px;
      left: 50%;
      transform: translateX(-50%);
      width: 18px;
      height: 4px;
      background: #111111;
      border-radius: 2px;
    }

    .temple {
      position: absolute;
      top: 21px;
      width: 14px;
      height: 4px;
      background: #111111;
      border-radius: 2px;
    }
    .temple.left  { left: 0px; }
    .temple.right { right: 0px; }

    /* ----- INFO SECTION ----- */
    .info-section {
      text-align: center;
      width: 100%;
    }

    .name {
      font-size: 2rem;
      font-weight: 700;
      color: #0f1c2e;
      letter-spacing: -0.02em;
      margin-bottom: 0.2rem;
    }

    .title-badge {
      display: inline-block;
      background: #e5edf9;
      border-radius: 30px;
      padding: 0.3rem 1rem;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #2c577b;
      margin-bottom: 1rem;
    }

    .description {
      font-size: 0.9rem;
      line-height: 1.6;
      color: #3f5368;
      margin-bottom: 1.5rem;
      padding: 0 0.5rem;
    }

    .description strong {
      color: #0f1c2e;
      font-weight: 600;
    }

    /* Tech pills */
    .tech-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin: 1.2rem 0;
    }

    .pill {
      background: #f0f4fa;
      border: 1px solid #d6e2f0;
      border-radius: 30px;
      padding: 0.3rem 0.9rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: #2c577b;
      transition: all 0.15s;
    }

    .pill:hover {
      background: #e0ebf7;
      border-color: #b0cae0;
    }

    /* Location */
    .location {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.85rem;
      color: #6b8299;
      margin-top: 0.8rem;
      border-top: 1px solid #e6edf5;
      padding-top: 1rem;
      width: 80%;
      margin-left: auto;
      margin-right: auto;
    }

    .location svg {
      width: 16px;
      height: 16px;
      fill: #6b8299;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .avatar-card {
        padding: 1.5rem 1rem;
      }
      .name {
        font-size: 1.8rem;
      }
      .avatar-container {
        transform: scale(0.92);
        margin-bottom: 0.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="avatar-card">
    <!-- AVATAR — rebuilt to match the reference image -->
    <div class="avatar-container" id="avatar">
      <!-- soft lavender background panel -->
      <div class="avatar-bg"></div>

      <!-- body / turtleneck sweater -->
      <div class="sweater"></div>
      <div class="collar"></div>

      <!-- neck -->
      <div class="neck"></div>

      <!-- head -->
      <div class="head"></div>

      <!-- ears -->
      <div class="ear left"></div>
      <div class="ear right"></div>

      <!-- hair: base, swoop, sides -->
      <div class="hair-base"></div>
      <div class="hair-swoop"></div>
      <div class="hair-side left"></div>
      <div class="hair-side right"></div>

      <!-- facial features -->
      <div class="face">
        <div class="eyebrow left"></div>
        <div class="eyebrow right"></div>

        <div class="eye left"><div class="pupil"></div></div>
        <div class="eye right"><div class="pupil"></div></div>

        <div class="nose"></div>
        <div class="mustache"></div>
        <div class="beard"></div>
        <div class="mouth"></div>
      </div>

      <!-- round glasses -->
      <div class="glasses">
        <div class="lens left"></div>
        <div class="lens right"></div>
        <div class="bridge"></div>
        <div class="temple left"></div>
        <div class="temple right"></div>
      </div>
    </div>

    <!-- INFO (unchanged) -->
    <div class="info-section">
      <h1 class="name">Wael Halila</h1>
      <div class="title-badge">Data · .NET · DevOps · AI</div>
      <p class="description">
        Engineer with <strong>4+ years</strong> in financial services.
        Data integration, <strong>.NET 8</strong> microservices, Azure DevOps CI/CD,
        and an <strong>LLM assistant</strong> on Ivanti HEAT. ITIL 5 Foundation.
      </p>
      <div class="tech-pills">
        <span class="pill">.NET 8</span>
        <span class="pill">Azure DevOps</span>
        <span class="pill">LLM / AI</span>
        <span class="pill">Data Integration</span>
        <span class="pill">ITIL 5</span>
        <span class="pill">Ivanti HEAT</span>
      </div>
      <div class="location">
        <svg viewBox="0 0 24 24" width="16" height="16">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
        </svg>
        <span>Tunis, Tunisia</span>
      </div>
    </div>
  </div>

  <!-- subtle eye tracking -->
  <script>
    (function () {
      const pupils = document.querySelectorAll('.pupil');
      const avatar = document.getElementById('avatar');

      if (pupils.length && avatar) {
        document.addEventListener('mousemove', (e) => {
          const rect = avatar.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;

          const deltaX = Math.max(-3, Math.min(3, (e.clientX - centerX) / 35));
          const deltaY = Math.max(-2, Math.min(2, (e.clientY - centerY) / 40));

          pupils.forEach(pupil => {
            pupil.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;
          });
        });

        document.addEventListener('mouseleave', () => {
          pupils.forEach(pupil => {
            pupil.style.transform = 'translate(-50%, -50%)';
          });
        });
      }
    })();
  </script>
</body>
</html>
