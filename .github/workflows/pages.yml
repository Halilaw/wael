name: Verify and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check references, JavaScript and CSP rules
        run: python3 scripts/verify.py
      - name: Profile pages are up to date
        run: |
          python3 scripts/build_variants.py
          git diff --exit-code -- data.html dotnet.html devops.html || { echo "Run python3 scripts/build_variants.py and commit the result"; exit 1; }
  deploy:
    # Only runs when the repo variable USE_ACTIONS is "true" (Settings > Secrets and variables > Actions > Variables)
    # and Settings > Pages > Source is "GitHub Actions". Otherwise Pages serves the branch directly and this job is skipped.
    if: ${{ vars.USE_ACTIONS == 'true' && github.event_name != 'pull_request' }}
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage site
        run: |
          mkdir _site
          cp -r index.html 404.html data.html dotnet.html devops.html favicon.ico manifest.webmanifest sw.js robots.txt sitemap.xml site.url .nojekyll .well-known assets _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
